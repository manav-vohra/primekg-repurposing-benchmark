[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primekg-repurposing"
version = "0.1.0"
description = "PrimeKG P1 provenance, benchmark reconstruction, and tie-safe evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
full = ["numpy>=1.26"]
reconstruct = ["numpy>=1.26", "pandas>=2.0"]
evaluator = ["numpy>=1.26"]
e2 = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11,<2"]
e3 = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11,<2", "torch>=2.0"]

[project.scripts]
primekg-repurpose = "primekg_repurposing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
