name: Artifact, benchmark, and evaluator validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Exercise E3's small CPU fixtures without installing CUDA libraries or training.
      - run: python -m pip install 'torch>=2.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[reconstruct,e2,e3,analysis,test]'
      - run: python -m pytest tests -v -rs
      - run: primekg-repurpose validate --tier smoke
      - run: primekg-repurpose validate --tier reference
      - run: primekg-repurpose validate --tier reference --benchmark-semantics
  cpu-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # This job deliberately has no torch, scipy, pandas, GPU or external artifacts.
      - run: python -m pip install -e '.[analysis,test]'
      - run: python -m pytest tests/test_analysis.py tests/test_downstream.py tests/test_reproduction.py -q
      - run: primekg-repurpose reproduce --output work/ci-reproduction
